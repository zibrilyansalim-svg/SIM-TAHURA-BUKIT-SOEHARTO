 rooms:{title:"Ruang",f:[{k:"nama",l:"Nama blok/area"},{k:"jenis",l:"Jenis",o:fix(["Seluruh kawasan","Blok","Area/KHDTK"])},{k:"luas",l:"Luas (ha)",t:"number",r:1,show:ha},{k:"pj",l:"Penanggung jawab",n:1,o:opt("pics"),show:v=>E(nm("pics",v))},{k:"sumber",l:"Sumber data",r:1},KPF]},
 items:{title:"Isi Ruang",f:[{k:"room",l:"Ruang",n:1,o:opt("rooms"),show:v=>E(nm("rooms",v))},{k:"jenis",l:"Jenis",o:fix(["Fauna","Flora/Ekosistem","Sarana"])},{k:"nama",l:"Nama"},{k:"ket",l:"Keterangan/jumlah",r:1},{k:"sumber",l:"Sumber",r:1},KPF]},
 pics:{title:"Penanggung Jawab",f:[{k:"nama",l:"Nama"},{k:"jabatan",l:"Jabatan"},{k:"instansi",l:"Instansi"},{k:"kontak",l:"Kontak",r:1},{k:"sumber",l:"Sumber",r:1},KPF]},
 factors:{title:"Faktor Eksternal",f:[{k:"room",l:"Ruang terdampak",n:1,o:opt("rooms"),show:v=>E(nm("rooms",v))},{k:"jenis",l:"Jenis faktor",o:fix(["Kebakaran","Pendudukan lahan","Pertambangan ilegal","Infrastruktur","Pembangunan IKN","Sumber air","Lainnya"])},{k:"deskripsi",l:"Deskripsi"},{k:"dampak",l:"Dampak",o:fix(["Rendah","Sedang","Tinggi"]),show:tag},{k:"prob",l:"Kemungkinan (1-5)",n:1,o:fix([1,2,3,4,5])},{k:"skor",l:"Skor risiko",calc:f=>skor(f)+" "+tag(kat(skor(f)))},{k:"status",l:"Tindak lanjut",o:fix(["Dilaporkan","Ditangani","Selesai"]),show:v=>`<span class="tag ${{"Selesai":"g","Ditangani":"y","Dilaporkan":"r"}[v]||""}">${E(v)}</span>`},{k:"sumber",l:"Sumber",r:1},KPF]}
};

function dash(){
 const hi=db.factors.filter(f=>f.dampak=="Tinggi").length;
 const rows=db.rooms.map(r=>{
  const its=db.items.filter(i=>i.room==r.id),fs=db.factors.filter(f=>f.room==r.id);
  return `<tr><td><b>${E(r.nama)}</b><br><small>${E(r.jenis)} · ${ha(r.luas)}</small></td><td>${E(nm("pics",r.pj))}</td><td>${its.length?its.map(i=>E(i.nama)).join("; "):"-"}</td><td>${fs.length?fs.map(f=>E(f.jenis)+" "+tag(f.dampak)).join("<br>"):"-"}</td></tr>`}).join("");
 return `<div class="stats"><div class="st"><b>${db.rooms.length}</b><span>Ruang terdaftar</span></div><div class="st"><b>${db.items.length}</b><span>Catatan isi ruang</span></div><div class="st"><b>${db.pics.length}</b><span>Penanggung jawab</span></div><div class="st"><b>${hi}</b><span>Faktor dampak tinggi</span></div><div class="st"><b>${db.notes.length}</b><span>Catatan lapangan</span></div><div class="st"><b>${db.plans.filter(p=>pprog(p)==100).length}/${db.plans.length}</b><span>Rencana aksi selesai</span></div></div>
 <div class="box"><h2>Ringkasan per ruang</h2><div class="tw"><table><tr><th>Ruang</th><th>Penanggung jawab</th><th>Isi ruang</th><th>Faktor eksternal</th></tr>${rows}</table></div></div>
 ${analysis()}${qualityBox()}${trendBox()}${backupBox()}<div class="box"><h2>Catatan data</h2><p class="note">Luas kawasan mengikuti SK.1231/2017 (64.814,98 ha). Pengelolaan kini dilaporkan beralih ke Otorita IKN, dengan UPTD dan Dinas Kehutanan Kaltim membantu. Luas per blok resmi (SK 415/KSDAE/SET/KSA.0/10/2019) belum tersedia di web, jadi isi manual dari dokumen SK. Sebagian besar angka bersumber berita (data hingga Okt 2026) dan perlu diverifikasi ke UPTD Tahura atau Dinas Kehutanan Kaltim. Jabatan dapat berubah.</p></div>`}

const DS={"Rendah":1,"Sedang":3,"Tinggi":5},TH={r:6,s:14};
const skor=f=>(f.prob||3)*(DS[f.dampak]||1);
const kat=s=>s>TH.s?"Tinggi":s>TH.r?"Sedang":"Rendah";
function bars(d,mx,sf){const m=mx||Math.max(1,...d.map(x=>x[1]));return d.map(([l,n,c])=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:130px;font-size:13px">${E(l)}</span><div style="flex:1;background:var(--ac2);border-radius:4px"><div style="width:${n/m*100}%;min-width:${n?4:0}px;background:${c||"var(--ac)"};height:16px;border-radius:4px"></div></div><b style="width:${sf?40:24}px;text-align:right">${n}${sf||""}</b></div>`).join("")}
function filled(x,f){const v=x[f.k];if(f.k=="pj")return db.pics.some(p=>p.id==v);if(f.k=="room")return db.rooms.some(r=>r.id==v);return v!==null&&v!==undefined&&String(v).trim()!==""}
function qualityBox(){
 const ks=["rooms","items","pics","factors"],kc={"Resmi":"var(--ok)","Berita":"var(--ac)","Asumsi":"var(--wr)","Perlu verifikasi":"var(--er)"};
 let T=0,D=0;const kosong=[];
 const per=ks.map(k=>{let t=0,d=0;CFG[k].f.filter(f=>!f.calc&&f.k!="kep").forEach(f=>{let e=0;db[k].forEach(x=>{t++;if(filled(x,f))d++;else e++});if(e)kosong.push(CFG[k].title+": "+f.l+" ("+e+" dari "+db[k].length+" kosong)")});T+=t;D+=d;return [CFG[k].title,t?Math.round(d/t*100):100]});
 const all=ks.flatMap(k=>db[k].map(kp)),kd=KP.map(c=>[c,all.filter(x=>x==c).length,kc[c]]);
 const pct=T?Math.round(D/T*100):100,rs=all.length?Math.round(all.filter(x=>x=="Resmi").length/all.length*100):0;
 return `<div class="box"><h2>Kelengkapan dan kepercayaan data</h2><div class="stats"><div class="st"><b>${pct}%</b><span>Kelengkapan isian data</span></div><div class="st"><b>${rs}%</b><span>Entri bersumber resmi</span></div><div class="st"><b>${kd[3][1]}</b><span>Entri perlu verifikasi</span></div></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px"><div><div class="h3">Kelengkapan per tabel</div>${bars(per,100,"%")}<div class="h3">Isian yang masih kosong</div>${kosong.length?"<ul>"+kosong.map(e=>`<li>${E(e)}</li>`).join("")+"</ul>":'<p class="note">Semua isian terisi.</p>'}</div>
 <div><div class="h3">Tingkat kepercayaan (${all.length} entri)</div>${bars(kd)}<p class="note">Resmi = peraturan atau dokumen resmi; Berita = pemberitaan atau siaran pers; Asumsi = penilaian penulis; Perlu verifikasi = belum bisa dipastikan. Kelengkapan = isian terisi dibagi seluruh isian pada empat tabel utama (kolom kepercayaan tidak dihitung). Entri lama ditentukan otomatis dari kolom sumber, jadi periksa dan tetapkan lewat tombol Ubah.</p></div></div></div>`}
function alerts(){
 const a=[];
 db.rooms.forEach(r=>{
  if(!db.pics.some(p=>p.id==r.pj))a.push(`Ruang "${r.nama}" belum punya penanggung jawab`);
  if(!r.luas)a.push(`Luas ruang "${r.nama}" belum diisi`);
  if(!db.items.some(i=>i.room==r.id))a.push(`Ruang "${r.nama}" belum punya catatan isi ruang`)});
 db.factors.filter(f=>kat(skor(f))=="Tinggi"&&f.status!="Selesai").forEach(f=>a.push(`Risiko tinggi belum selesai: ${f.jenis} (skor ${skor(f)}, ${f.status})`));
 db.factors.filter(f=>kat(skor(f))=="Tinggi"&&!db.plans.some(p=>p.factor==f.id)).forEach(f=>a.push(`Risiko tinggi belum punya rencana aksi: ${f.jenis}`));
 db.plans.filter(p=>pstat(p)=="Terlambat").forEach(p=>a.push(`Rencana aksi terlambat: ${p.nama} (target ${p.target})`));
 const u=db.marks.filter(m=>!m.ok).length;if(u)a.push(`${u} titik peta masih berupa perkiraan`);
 return a}
function analysis(){
 const col={Tinggi:"var(--er)",Sedang:"var(--wr)",Rendah:"var(--ok)"};
 const kc=["Tinggi","Sedang","Rendah"].map(k=>[k,db.factors.filter(f=>kat(skor(f))==k).length,col[k]]);
 const st=["Dilaporkan","Ditangani","Selesai"].map(s=>[s,db.factors.filter(f=>f.status==s).length]);
 const ij=["Fauna","Flora/Ekosistem","Sarana"].map(s=>[s,db.items.filter(i=>i.jenis==s).length]);
 let m='<table style="text-align:center"><tr><th>Kemungkinan</th><th>Dampak rendah</th><th>Dampak sedang</th><th>Dampak tinggi</th></tr>';
 for(let p=5;p>=1;p--){m+=`<tr><th>${p}</th>`;["Rendah","Sedang","Tinggi"].forEach(d=>{const n=db.factors.filter(f=>f.prob==p&&f.dampak==d).length;m+=`<td style="background:color-mix(in srgb,${col[kat(p*DS[d])]} 28%,transparent)"><b>${n||""}</b></td>`});m+="</tr>"}
 m+="</table>";
 const al=alerts();
 return `<div class="box"><h2>Peringatan otomatis (${al.length})</h2>${al.length?"<ul>"+al.map(a=>`<li>${E(a)}</li>`).join("")+"</ul>":'<p class="note">Tidak ada peringatan.</p>'}</div>
 <div class="box"><h2>Analisis faktor eksternal</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px"><div><div class="h3">Kategori risiko</div>${bars(kc)}<div class="h3">Status tindak lanjut</div>${bars(st)}<div class="h3">Isi ruang per jenis</div>${bars(ij)}</div><div><div class="h3">Matriks risiko (kemungkinan x dampak)</div>${m}<p class="note">Skor = kemungkinan (1-5) x bobot dampak (rendah ${DS.Rendah}, sedang ${DS.Sedang}, tinggi ${DS.Tinggi}). Skor 1-${TH.r} rendah, ${TH.r+1}-${TH.s} sedang, di atas ${TH.s} tinggi (bisa diatur di tab Pengaturan Risiko). Nilai kemungkinan pada data awal adalah penilaian contoh, ubah sesuai analisismu.</p></div></div></div>`}
function info(rid){
 const r=db.rooms.find(x=>x.id==rid);if(!r)return"";
 const its=db.items.filter(i=>i.room==rid),fs=db.factors.filter(f=>f.room==rid);
 return `<b>${E(r.nama)}</b><br>Penanggung jawab: ${E(nm("pics",r.pj))}<br>Isi: ${its.length?its.map(i=>E(i.nama)).join("; "):"-"}<br>Faktor: ${fs.length?fs.map(f=>E(f.jenis)+" ("+E(f.dampak)+")").join(", "):"-"}`}

function mapView(){
 return `<div class="box"><h2>Peta lokasi</h2>${can("add")?'<div class="row noprint"><button class="btn sm" id="nbtn" onclick="togMode()">Mode tambah catatan: mati</button><span class="note">Aktifkan, lalu klik titik di peta untuk mencatat kejadian.</span></div>':""}<div id="map"></div>
 <p class="note">Titik hijau bersumber dari peraturan (patok batas desa dalam Tahura). Titik oranye adalah perkiraan kasar: seret ke lokasi sebenarnya, posisi tersimpan otomatis. Batas blok resmi dapat diimpor di bawah. Kotak berwarna adalah catatan lapangan (hijau, kuning, merah = risiko rendah, sedang, tinggi); Admin dan Petugas dapat menggesernya.</p></div>
 ${noteBox()}<div class="box"><h2>Impor batas blok (GeoJSON)</h2>
 <p class="note">Gunakan properti <b>nama</b> pada tiap fitur yang sama dengan nama ruang agar popup menampilkan penanggung jawab, isi ruang, dan faktor eksternalnya.</p>
 <div class="row"><input type="file" id="gf" accept=".geojson,.json" style="max-width:320px"></div>
 <textarea id="gt" rows="4" placeholder="Atau tempel isi GeoJSON di sini"></textarea>
 <div class="row"><button class="btn" onclick="impGeo()">Tampilkan di peta</button><button class="btn sec" onclick="clrGeo()">Hapus batas impor</button><button class="btn sec" onclick="expMarks()">Ekspor titik (GeoJSON)</button></div></div>`}

function initMap(){
 if(map){map.remove();map=null}
 if(typeof L=="undefined"){document.getElementById("map").innerHTML='<p class="empty" style="padding:14px">Peta tidak termuat. Periksa koneksi internet lalu muat ulang.</p>';return}
 map=L.map("map").setView([-0.9,116.93],10);
 const osm=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Tiles &copy; Esri"}).addTo(map);
 const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Tiles &copy; Esri"});
 const mk=L.layerGroup().addTo(map),nl=L.layerGroup().addTo(map),over={"Titik lokasi":mk,"Catatan lapangan":nl},top=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Tiles &copy; Esri"}),base={"Peta jalan":osm,"Topografi":top,"Satelit":sat};
 db.marks.forEach(m=>{
  const c=m.ok?"#15803d":"#ea580c";
  const x=L.marker([m.lat,m.lng],{draggable:!m.ok&&can("edit"),icon:L.divIcon({className:"",html:`<div class="pin" style="background:${c}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).addTo(mk);
  x.bindPopup(`<b>${E(m.nama)}</b><br><i>${E(m.ket)}</i><br>${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}<hr>${info(m.room)}`);
  x.on("dragend",e=>{const p=e.target.getLatLng();m.lat=p.lat;m.lng=p.lng;logA("Ubah","Titik peta digeser: "+m.nama);x.setPopupContent(`<b>${E(m.nama)}</b><br><i>${E(m.ket)} (posisi digeser)</i><br>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}<hr>${info(m.room)}`)})});
 addMode=false;nlayer=nl;drawNotes();
 map.on("click",ev=>{if(!addMode||!can("add"))return;L.popup().setLatLng(ev.latlng).setContent(noteForm(ev.latlng)).openOn(map)});
 if(db.geo){
  try{const g=L.geoJSON(JSON.parse(db.geo),{style:()=>({color:"#2f6b3a",weight:2,fillOpacity:.3}),onEachFeature:(f,l)=>{
   const p=f.properties||{},n=p.nama||p.NAMA||p.name||p.BLOK||"";
   const r=db.rooms.find(x=>x.nama.toLowerCase()==String(n).toLowerCase());
   l.bindPopup(r?info(r.id):`<b>${E(n||"Tanpa nama")}</b><br>Belum cocok dengan data Ruang. Samakan properti nama dengan nama ruang.`)}}).addTo(map);
   over["Batas blok (impor)"]=g;map.fitBounds(g.getBounds())}catch(e){}}
 L.control.layers(base,over).addTo(map)}

function impGeo(){if(!can("geo")){alert("Peran Anda tidak boleh mengimpor batas.");return}

 if(f){const r=new FileReader();r.onload=()=>set(r.result);r.readAsText(f)}else if(t)set(t);else alert("Pilih file atau tempel GeoJSON dulu.")}

function crud(k){
 const c=CFG[k],cur=editing?db[k].find(x=>x.id==editing):{};
 const form=c.f.filter(f=>!f.calc).map(f=>{
  const v=cur[f.k]??(f.k=="kep"?(cur.id?kp(cur):"Perlu verifikasi"):"");
  if(f.o){const os=f.o();return `<label>${f.l}<select name="${f.k}" required>${os.length?"":'<option value="">(isi data terkait dulu)</option>'}${os.map(o=>`<option value="${E(o.v)}" ${o.v==v?"selected":""}>${E(o.l)}</option>`).join("")}</select></label>`}
  return `<label>${f.l}<input name="${f.k}" type="${f.t||"text"}" ${f.t?'min="0" step="any"':""} value="${E(v)}" ${f.r?"":"required"}></label>`}).join("");
 const ql=q.toLowerCase(),list=db[k].filter(x=>JSON.stringify(x).toLowerCase().includes(ql)||c.f.some(f=>["pj","room"].includes(f.k)&&nm(f.k=="pj"?"pics":"rooms",x[f.k]).toLowerCase().includes(ql))).filter(x=>!fv||String(x[c.flt])==fv);
 const sorted=sortList(list),pages=Math.max(1,Math.ceil(sorted.length/PS));if(pg>pages)pg=pages;
 const fopts=[...new Set(db[k].map(x=>x[c.flt]))].map(v=>`<option value="${E(v)}" ${v==fv?"selected":""}>${E(v)}</option>`).join("");
 const rows=sorted.slice((pg-1)*PS,pg*PS).map(x=>`<tr>${c.f.map(f=>`<td>${f.calc?f.calc(x):f.show?f.show(x[f.k],x):E(x[f.k])}</td>`).join("")}<td style="white-space:nowrap">${can("edit")?`<button class="btn sec sm" onclick="edit(${x.id})">Ubah</button> `:""}${can("del")?`<button class="btn del sm" onclick="del('${k}',${x.id})">Hapus</button>`:""}</td></tr>`).join("");
 return (can("add")?`<div class="box"><h2>${editing?"Ubah":"Tambah"} ${c.title}</h2><form onsubmit="submitF(event,'${k}')">${form}<div><button class="btn" type="submit">Simpan</button> ${editing?'<button class="btn sec" type="button" onclick="go(tab)">Batal</button>':""}</div></form></div>`:"")+`
 <div class="box"><h2>Daftar ${c.title} (${list.length})</h2><div class="bar row"><input placeholder="Cari data..." value="${E(q)}" oninput="q=this.value;pg=1;search()" style="max-width:260px"><select onchange="fv=this.value;pg=1;render()" style="max-width:220px"><option value="">Semua (${c.flt})</option>${fopts}</select><button class="btn sec sm" onclick="expCSV('${k}')">Ekspor CSV</button></div><div class="tw"><table><tr>${c.f.map(f=>`<th style="cursor:pointer" onclick="srt('${f.k}')">${f.l}${sk==f.k?(sd>0?" ▲":" ▼"):""}</th>`).join("")}<th>Aksi</th></tr>${rows}</table>${rows?"":'<p class="empty">Tidak ada data yang cocok. Ubah pencarian atau filter, atau tambah data.</p>'}</div><div class="row" style="align-items:center"><button class="btn sec sm" onclick="pg=Math.max(1,pg-1);render()" ${pg<=1?"disabled":""}>Sebelumnya</button><span class="note">Halaman ${pg} dari ${pages}</span><button class="btn sec sm" onclick="pg=Math.min(${pages},pg+1);render()" ${pg>=pages?"disabled":""}>Berikutnya</button></div></div>`}

const PS=8;
CFG.rooms.flt="jenis";CFG.items.flt="jenis";CFG.pics.flt="instansi";CFG.factors.flt="status";
const gv=(x,k)=>k=="skor"?skor(x):k=="kep"?kp(x):k=="pj"?nm("pics",x.pj):k=="room"?nm("rooms",x.room):(x[k]??"");
function sortList(l){if(!sk)return l;return [...l].sort((a,b)=>{const u=gv(a,sk),v=gv(b,sk);return (typeof u=="number"&&typeof v=="number"?u-v:String(u).localeCompare(String(v),"id",{numeric:true}))*sd})}
function srt(k){sd=sk==k?-sd:1;sk=k;pg=1;render()}

function csv(k){const c=CFG[k],z=v=>'"'+String(v??"").replace(/"/g,'""')+'"';return "\ufeff"+[c.f.map(f=>z(f.l)).join(",")].concat(db[k].map(x=>c.f.map(f=>z(gv(x,f.k))).join(","))).join("\r\n")}

function restore(t){
 let o;try{o=JSON.parse(t)}catch(e){alert("File bukan JSON yang valid.");return}
 if(!["rooms","items","pics","factors"].every(k=>Array.isArray(o[k]))){alert("Struktur cadangan tidak sesuai.");return}
 if(!confirm("Impor akan menimpa semua data saat ini. Lanjutkan?"))return;
 db=o;db.cfg??=JSON.parse(JSON.stringify(seed.cfg));db.notes??=[];db.plans??=[];db.marks??=[];db.geo??=null;db.log??=[];db.factors.forEach(f=>{f.prob??=3;f.status??="Dilaporkan"});
 logA("Impor","Cadangan data dipulihkan");go("dash")}

const sv=(w,h,i)=>`<div class="tw"><svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:560px;max-width:${w}px;font:12px sans-serif;fill:var(--tx)"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker></defs>${i}</svg></div>`;
const tx=(x,y,t,a,b)=>`<text x="${x}" y="${y}" text-anchor="${a||"start"}"${b?' font-weight="700"':""}>${E(t)}</text>`;
const bx=(x,y,w,h,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r||4}" style="fill:var(--sf);stroke:var(--ac);stroke-width:1.5"/>`;
const ar=(a,b,c,d,l)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="stroke:var(--mu);stroke-width:1.3" marker-end="url(#ar)"/>${l?tx((a+c)/2,(b+d)/2-4,l,"middle"):""}`;
function ent(x,y,w,t,ls){return bx(x,y,w,26+ls.length*15)+tx(x+w/2,y+17,t,"middle",1)+`<line x1="${x}" y1="${y+24}" x2="${x+w}" y2="${y+24}" style="stroke:var(--ac)"/>`+ls.map((l,i)=>tx(x+8,y+39+i*15,l)).join("")}

 ent(560,20,190,"ISI_RUANG",["PK id","FK room","jenis","nama","ket","sumber, kepercayaan"])+
 ent(290,230,200,"FAKTOR_EKSTERNAL",["PK id","FK room","jenis","deskripsi","dampak","prob (1-5)","status","sumber, kepercayaan"])+
 ent(20,230,200,"TITIK_PETA",["PK id","FK room","nama","lat, lng","ok (terverifikasi)","ket"])+ent(560,230,190,"CATATAN_LAPANGAN",["PK id","FK room","tgl","jenis","dampak, prob","lat, lng","ket"])+
 ar(220,80,290,80,"1:N")+ar(490,80,560,80,"1:N")+ar(390,136,390,230,"1:N")+ar(310,136,150,230,"1:N")+ar(470,136,640,230,"1:N")+ent(290,410,200,"RENCANA_AKSI",["PK id","FK factor","FK pj","nama","target","hambatan","milestones (daftar)"])+ar(390,376,390,410,"1:N"))}

 i+=ar(130,52,335,105,"kelola, impor")+ar(130,132,325,130,"input, ubah data")+ar(130,212,340,170,"login, minta laporan")+ar(345,175,130,235,"dashboard, laporan");

 return `<div class="box"><h2>Tentang sistem</h2>

 <p><b>Ruang lingkup.</b> Pencatatan data master, analisis risiko sederhana (kemungkinan x dampak), pemetaan titik lokasi, catatan lapangan berbasis peta, rencana aksi dan milestone, pengaturan bobot risiko, pelaporan per ruang, penilaian tingkat kepercayaan dan kelengkapan data, ekspor dan cadangan data, serta pencatatan aktivitas pengguna.</p>

 <p><b>Sumber data.</b> Permen LHK P.76/Menlhk-Setjen/2015; SK Menteri LHK SK.1231/2017; SK Dirjen KSDAE 415/KSDAE/SET/KSA.0/10/2019; Perbup Kutai Kartanegara 34/2024; Pergub Kaltim 35/2018; pemberitaan Antara, Kompas, Bisnis.com, RRI, Tribun Kaltim, Mongabay, dan CNN Indonesia. Tiap data memuat kolom sumber dan tingkat kepercayaan (Resmi, Berita, Asumsi, atau Perlu verifikasi).</p></div>
 <div class="box"><h2>ERD (diagram relasi entitas)</h2>${erd()}<p class="note">PK = kunci utama, FK = kunci asing. Satu penanggung jawab mengelola banyak ruang; satu ruang memiliki banyak isi ruang, faktor eksternal, titik peta, dan catatan lapangan; satu faktor eksternal dapat memiliki banyak rencana aksi.</p></div>

let addMode=false,nfj="",nfk="",nlayer=null;
const FJ=["Kebakaran","Pendudukan lahan","Pertambangan ilegal","Infrastruktur","Pembangunan IKN","Sumber air","Lainnya"];
const nfilt=()=>db.notes.filter(n=>(!nfj||n.jenis==nfj)&&(!nfk||kat(skor(n))==nfk));
function noteForm(ll,n){n=n||{};const o=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");return `<div style="min-width:220px"><b>${n.id?"Ubah catatan lapangan":"Catatan lapangan baru"}</b><br><small>${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}</small><label>Jenis<select id="nj">${o(FJ,n.jenis)}</select></label><label>Tanggal<input id="nt" type="date" value="${n.tgl||new Date().toISOString().slice(0,10)}"></label><label>Dampak<select id="nd">${o(["Rendah","Sedang","Tinggi"],n.dampak)}</select></label><label>Kemungkinan (1-5)<select id="np">${o([1,2,3,4,5],n.prob)}</select></label><label>Ruang<select id="nr">${db.rooms.map(r=>`<option value="${r.id}" ${r.id==n.room?"selected":""}>${E(r.nama)}</option>`).join("")}</select></label><label>Keterangan<input id="nk" maxlength="160" value="${E(n.ket||"")}"></label>${n.perk?'<label><input type="checkbox" id="nv" style="width:auto"> Lokasi sudah diverifikasi</label>':""}<button class="btn sm" style="margin-top:6px" onclick="saveNote(${ll.lat},${ll.lng}${n.id?","+n.id:""})">Simpan</button></div>`}
function noteInfo(n){return `<b>${E(n.jenis)}</b> (${kat(skor(n))}, skor ${skor(n)})<br>${E(n.tgl)} · ${E(nm("rooms",n.room))}<br>${E(n.ket||"-")}${n.perk?'<br><b>Lokasi perkiraan</b>: belum diverifikasi (geser titik, lalu pilih Ubah dan centang verifikasi)':""}<br><small>Dicatat oleh ${E(n.oleh)} · ${n.lat.toFixed(5)}, ${n.lng.toFixed(5)}</small>${can("edit")||can("del")?"<br>":""}${can("edit")?`<button class="btn sec sm" onclick="edNote(${n.id})">Ubah</button> `:""}${can("del")?`<button class="btn del sm" onclick="delNote(${n.id})">Hapus</button>`:""}`}
function drawNotes(){
 if(!nlayer)return;nlayer.clearLayers();const col={Tinggi:"#b91c1c",Sedang:"#d97706",Rendah:"#15803d"};
 nfilt().forEach(n=>{
  const x=L.marker([n.lat,n.lng],{draggable:can("edit"),icon:L.divIcon({className:"",html:`<div class="pin" style="background:${col[kat(skor(n))]};border-radius:4px"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).addTo(nlayer).bindPopup(noteInfo(n));
  x.on("dragend",e=>{const q=e.target.getLatLng();n.lat=q.lat;n.lng=q.lng;logA("Ubah","Titik catatan digeser: "+n.jenis);x.setPopupContent(noteInfo(n));refList()})})}
function saveNote(lat,lng,eid){
 if(!can(eid?"edit":"add"))return;const g=id=>document.getElementById(id).value;
 const d={tgl:g("nt"),jenis:g("nj"),dampak:g("nd"),prob:Number(g("np")),room:Number(g("nr")),ket:g("nk")};
 if(eid){const n=db.notes.find(x=>x.id==eid);if(!n)return;Object.assign(n,d);const v=document.getElementById("nv");if(v&&v.checked)delete n.perk;logA("Ubah","Catatan lapangan: "+n.jenis)}
 else{db.notes.push(Object.assign({id:Date.now(),lat,lng,oleh:user.name},d));logA("Tambah","Catatan lapangan: "+d.jenis)}
 if(map)map.closePopup();drawNotes();refList()}
function edNote(id){const n=db.notes.find(x=>x.id==id);if(!n||!can("edit")||!map)return;map.setView([n.lat,n.lng],Math.max(map.getZoom(),13));L.popup().setLatLng([n.lat,n.lng]).setContent(noteForm(n,n)).openOn(map)}

 if(!can("del")||!confirm("Hapus catatan ini?"))return;
 const n=db.notes.find(x=>x.id==id);db.notes=db.notes.filter(x=>x.id!=id);logA("Hapus","Catatan lapangan: "+(n?n.jenis:id));

function goNote(id){const n=db.notes.find(x=>x.id==id);if(n&&map){map.setView([n.lat,n.lng],15);scrollTo(0,0)}}
function togMode(){addMode=!addMode;const b=document.getElementById("nbtn");if(b)b.textContent="Mode tambah catatan: "+(addMode?"AKTIF (klik peta)":"mati");if(map)map.getContainer().style.cursor=addMode?"crosshair":""}
function notesGeo(){return {type:"FeatureCollection",features:db.notes.map(n=>({type:"Feature",properties:{tanggal:n.tgl,jenis:n.jenis,dampak:n.dampak,kemungkinan:n.prob,skor:skor(n),ruang:nm("rooms",n.room),keterangan:n.ket,pencatat:n.oleh,lokasi_perkiraan:!!n.perk},geometry:{type:"Point",coordinates:[n.lng,n.lat]}}))}}

let pfs="";
const today=()=>new Date().toISOString().slice(0,10);
const pprog=p=>p.ms.length?Math.round(p.ms.filter(m=>m.done).length/p.ms.length*100):0;
const pstat=p=>{const g=pprog(p);return g==100?"Selesai":p.target&&p.target<today()?"Terlambat":g==0?"Belum mulai":"Berjalan"};
const ptag=s=>`<span class="tag ${{"Selesai":"g","Terlambat":"r","Belum mulai":"y"}[s]||""}">${s}</span>`;
function syncF(fid){
 const f=db.factors.find(x=>x.id==fid),ps=db.plans.filter(p=>p.factor==fid);if(!f||!ps.length)return;
 const ns=ps.every(p=>pprog(p)==100)?"Selesai":ps.some(p=>pprog(p)>0)?"Ditangani":f.status;
 if(ns!=f.status){f.status=ns;logA("Ubah","Status tindak lanjut faktor "+f.jenis+" menjadi "+ns+" (otomatis dari rencana aksi)")}}
const rencana=fs=>{const ps=db.plans.filter(p=>fs.some(f=>f.id==p.factor));return ps.length?`<div class="h3">Rencana aksi</div><table><tr><th>Rencana</th><th>Penanggung jawab</th><th>Target</th><th>Progres</th></tr>${ps.map(p=>`<tr><td>${E(p.nama)}</td><td>${E(nm("pics",p.pj))}</td><td>${E(p.target)}</td><td>${pprog(p)}% (${pstat(p)})</td></tr>`).join("")}</table>`:""};
function mkPlan(d){
 const ms=String(d.ms).split("\n").map(x=>x.trim()).filter(Boolean).map(n=>({n,done:false,tgl:"",bukti:""}));
 if(!ms.length){alert("Isi minimal satu milestone.");return false}
 db.plans.push({id:Date.now(),factor:Number(d.factor),nama:d.nama,pj:Number(d.pj),target:d.target,hambatan:"",ms});
 logA("Tambah","Rencana aksi: "+d.nama);syncF(Number(d.factor));return true}
function addPlan(e){e.preventDefault();if(!can("add"))return;if(mkPlan(Object.fromEntries(new FormData(e.target)))){save();render()}}
function togMs(pid,i){
 const p=db.plans.find(x=>x.id==pid);if(!p||!can("edit"))return;
 const m=p.ms[i];m.done=!m.done;m.tgl=m.done?today():"";
 logA("Ubah","Milestone "+(m.done?"selesai":"dibatalkan")+": "+m.n);syncF(p.factor);save();render()}
function edMs(pid,i){
 const p=db.plans.find(x=>x.id==pid);if(!p||!can("edit"))return;
 const v=prompt("Bukti pencapaian (nama dokumen, tautan, atau keterangan):",p.ms[i].bukti);if(v===null)return;
 p.ms[i].bukti=v.trim();logA("Ubah","Bukti milestone: "+p.ms[i].n);save();render()}
function edHb(pid){
 const p=db.plans.find(x=>x.id==pid);if(!p||!can("edit"))return;

 if(!can("del")||!confirm("Hapus rencana aksi ini?"))return;
 const p=db.plans.find(x=>x.id==pid);db.plans=db.plans.filter(x=>x.id!=pid);logA("Hapus","Rencana aksi: "+(p?p.nama:pid));save();render()}
function plansCsv(){
 const z=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 return "\ufeff"+[["Rencana","Faktor","Penanggung jawab","Target","Progres (%)","Status","Hambatan"].map(z).join(",")].concat(db.plans.map(p=>{const f=db.factors.find(x=>x.id==p.factor)||{};return [p.nama,f.jenis,nm("pics",p.pj),p.target,pprog(p),pstat(p),p.hambatan].map(z).join(",")})).join("\r\n")}
function expPlans(){logA("Ekspor","CSV Rencana aksi");dl("tahura-rencana-aksi.csv",plansCsv(),"text/csv")}
let pedit=null;
const pform=p=>`<form onsubmit="svPlan(event,${p.id})" style="margin-bottom:10px"><label>Nama rencana<input name="nama" value="${E(p.nama)}" required></label><label>Penanggung jawab<select name="pj">${db.pics.map(x=>`<option value="${x.id}" ${x.id==p.pj?"selected":""}>${E(x.nama)}</option>`).join("")}</select></label><label>Target selesai<input name="target" type="date" value="${E(p.target)}" required></label><div><button class="btn" type="submit">Simpan</button> <button class="btn sec" type="button" onclick="pedit=null;render()">Batal</button></div></form>`;
function chPlan(pid,d){
 const p=db.plans.find(x=>x.id==pid);if(!p)return false;
 if(!String(d.nama||"").trim()||!/^\d{4}-\d{2}-\d{2}$/.test(String(d.target||""))){alert("Nama dan target (tanggal) wajib diisi.");return false}
 p.nama=String(d.nama).trim();p.pj=Number(d.pj);p.target=d.target;logA("Ubah","Rencana aksi: "+p.nama);return true}
function svPlan(e,pid){e.preventDefault();if(!can("edit"))return;if(chPlan(pid,Object.fromEntries(new FormData(e.target)))){save();pedit=null;render()}}
function mkMs(pid,t){
 const p=db.plans.find(x=>x.id==pid),v=String(t||"").trim();if(!p||!v)return false;
 p.ms.push({n:v,done:false,tgl:"",bukti:""});logA("Tambah","Milestone: "+v);syncF(p.factor);return true}
function addMs(pid){if(!can("edit"))return;const i=document.getElementById("nm"+pid);if(mkMs(pid,i&&i.value)){save();render()}}
function rmMs(pid,i){
 const p=db.plans.find(x=>x.id==pid);if(!p||!p.ms[i])return false;
 if(p.ms.length<=1){alert("Rencana harus punya minimal satu milestone.");return false}
 const m=p.ms.splice(i,1)[0];logA("Hapus","Milestone: "+m.n);syncF(p.factor);return true}
function delMs(pid,i){if(!can("edit")||!confirm("Hapus milestone ini?"))return;if(rmMs(pid,i)){save();render()}}
function planView(){
 const fo=db.factors.map(f=>`<option value="${f.id}">${E(f.jenis)}: ${E(String(f.deskripsi).slice(0,50))}</option>`).join("");
 const po=db.pics.map(p=>`<option value="${p.id}">${E(p.nama)}</option>`).join("");
 const form=can("add")?`<div class="box"><h2>Tambah rencana aksi</h2><form onsubmit="addPlan(event)"><label>Faktor eksternal<select name="factor" required>${fo}</select></label><label>Nama rencana<input name="nama" required></label><label>Penanggung jawab<select name="pj" required>${po}</select></label><label>Target selesai<input name="target" type="date" required></label><label style="grid-column:1/-1">Milestone (satu per baris, berurutan)<textarea name="ms" rows="4" required></textarea></label><div><button class="btn" type="submit">Simpan</button></div></form></div>`:"";
 const st=["Belum mulai","Berjalan","Terlambat","Selesai"],l=db.plans.filter(p=>!pfs||pstat(p)==pfs);
 const cards=l.map(p=>{const f=db.factors.find(x=>x.id==p.factor)||{},g=pprog(p),ed=can("edit");
  return `<div class="box">${pedit==p.id&&ed?pform(p):""}<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${E(p.nama)}</b><br><span class="note">Faktor: ${E(f.jenis||"-")} ${f.dampak?tag(kat(skor(f))):""} · PJ: ${E(nm("pics",p.pj))} · Target: ${E(p.target||"-")}</span></div><div>${ptag(pstat(p))}</div></div>
  <div style="background:var(--ac2);border-radius:4px;margin:8px 0"><div style="width:${g}%;background:var(--ac);height:10px;border-radius:4px"></div></div><div class="note">Progres ${g}% (${p.ms.filter(m=>m.done).length}/${p.ms.length} milestone)</div>
  <div class="tw"><table><tr><th></th><th>Milestone</th><th>Realisasi</th><th>Bukti</th></tr>${p.ms.map((m,i)=>`<tr><td><input type="checkbox" style="width:auto" ${m.done?"checked":""} ${ed?"":"disabled"} onchange="togMs(${p.id},${i})"></td><td>${E(m.n)}</td><td>${E(m.tgl||"-")}</td><td>${E(m.bukti||"-")} ${ed?`<button class="btn sec sm" onclick="edMs(${p.id},${i})">Ubah</button> <button class="btn del sm" onclick="delMs(${p.id},${i})">Hapus</button>`:""}</td></tr>`).join("")}</table></div>${ed?`<div class="row"><input id="nm${p.id}" placeholder="Milestone baru" style="max-width:320px"><button class="btn sec sm" onclick="addMs(${p.id})">Tambah milestone</button></div>`:""}
  <p class="note">Hambatan: ${E(p.hambatan||"-")} ${ed?`<button class="btn sec sm" onclick="edHb(${p.id})">Ubah</button>`:""} ${ed&&pedit!=p.id?`<button class="btn sec sm" onclick="pedit=${p.id};render()">Ubah rencana</button> `:""}${can("del")?`<button class="btn del sm" onclick="delPlan(${p.id})">Hapus rencana</button>`:""}</p></div>`}).join("");
 return `${form}<div class="box"><h2>Rencana aksi dan milestone (${db.plans.length})</h2>${bars(st.map(x=>[x,db.plans.filter(p=>pstat(p)==x).length]))}<div class="row"><select onchange="pfs=this.value;render()" style="max-width:220px"><option value="">Semua status</option>${st.map(x=>`<option ${x==pfs?"selected":""}>${x}</option>`).join("")}</select><button class="btn sec sm" onclick="expPlans()">Ekspor CSV</button></div><p class="note">Centang milestone yang sudah tercapai; tanggal realisasi terisi otomatis. Status tindak lanjut faktor eksternal ikut diperbarui: Ditangani bila ada milestone tercapai, Selesai bila semua rencana faktor itu 100%. Dua rencana awal adalah contoh, ubah atau hapus sesuai analisismu.</p></div>${cards||'<div class="box"><p class="empty">Belum ada rencana aksi pada filter ini.</p></div>'}`}
let tj="";
const CL={Tinggi:"var(--er)",Sedang:"var(--wr)",Rendah:"var(--ok)"};
function applyCfg(){Object.assign(DS,db.cfg.bobot);TH.r=db.cfg.r;TH.s=db.cfg.s}
function mkCfg(d){
 const br=+d.br,bs=+d.bs,bt=+d.bt,r=+d.r,s=+d.s;
 if(![br,bs,bt,r,s].every(v=>Number.isInteger(v)&&v>=1&&v<=100)){alert("Semua nilai harus berupa bilangan bulat positif.");return false}
 if(!(br<=bs&&bs<=bt)){alert("Bobot harus berurutan: rendah, sedang, tinggi (tidak menurun).");return false}
 if(!(r<s)){alert("Batas kategori rendah harus lebih kecil dari batas kategori sedang.");return false}
 db.cfg={bobot:{Rendah:br,Sedang:bs,Tinggi:bt},r,s,asumsi:String(d.asumsi||"").trim(),tgl:today(),oleh:user.name};
 applyCfg();logA("Ubah","Bobot risiko rendah/sedang/tinggi = "+br+"/"+bs+"/"+bt+"; batas kategori "+r+" dan "+s);return true}
function saveCfg(e){e.preventDefault();if(!can("reset"))return;if(mkCfg(Object.fromEntries(new FormData(e.target)))){save();render()}}
function resetCfg(){if(!can("reset")||!confirm("Kembalikan bobot dan batas ke nilai bawaan?"))return;db.cfg=JSON.parse(JSON.stringify(seed.cfg));applyCfg();logA("Reset","Pengaturan bobot risiko dikembalikan ke bawaan");save();render()}
function cfgView(){
 const c=db.cfg,adm=can("reset"),dis=adm?"":"disabled",D=["Rendah","Sedang","Tinggi"];
 let m='<table style="text-align:center"><tr><th>Kemungkinan</th>'+D.map(d=>`<th>Dampak ${d.toLowerCase()} (bobot ${c.bobot[d]})</th>`).join("")+"</tr>";
 for(let p=5;p>=1;p--){m+=`<tr><th>${p}</th>`+D.map(d=>{const sc=p*c.bobot[d],k=kat(sc);return `<td style="background:color-mix(in srgb,${CL[k]} 28%,transparent)">${sc}<br><small>${k}</small></td>`}).join("")+"</tr>"}
 m+="</table>";
 const ft=db.factors.map(f=>`<tr><td>${E(f.jenis)}</td><td>${f.prob}</td><td>${E(f.dampak)} (${DS[f.dampak]})</td><td>${skor(f)}</td><td>${tag(kat(skor(f)))}</td></tr>`).join("");
 const inp=(n,l,v)=>`<label>${l}<input name="${n}" type="number" min="1" max="100" value="${v}" ${dis} required></label>`;
 return `<div class="box"><h2>Pengaturan bobot risiko</h2><p class="note">Skor risiko = kemungkinan (1-5) x bobot dampak. Bobot dan batas kategori di bawah adalah asumsi yang dapat disesuaikan; skor, grafik, peringatan, dan laporan ikut berubah.</p>
 <form onsubmit="saveCfg(event)">${inp("br","Bobot dampak rendah",c.bobot.Rendah)}${inp("bs","Bobot dampak sedang",c.bobot.Sedang)}${inp("bt","Bobot dampak tinggi",c.bobot.Tinggi)}${inp("r","Batas kategori rendah (skor sampai)",c.r)}${inp("s","Batas kategori sedang (skor sampai)",c.s)}<label style="grid-column:1/-1">Catatan asumsi<textarea name="asumsi" rows="3" ${dis}>${E(c.asumsi)}</textarea></label>${adm?'<div><button class="btn" type="submit">Simpan pengaturan</button> <button class="btn sec" type="button" onclick="resetCfg()">Kembalikan ke bawaan</button></div>':""}</form>
 <p class="note">${c.oleh?`Terakhir diubah ${E(c.tgl)} oleh ${E(c.oleh)}.`:"Masih memakai nilai bawaan."}${adm?"":" Hanya Admin yang dapat mengubah pengaturan."}</p></div>
 <div class="box"><h2>Pratinjau matriks skor</h2><div class="tw">${m}</div></div>
 <div class="box"><h2>Dampak pada data faktor eksternal saat ini</h2><div class="tw"><table><tr><th>Faktor</th><th>Kemungkinan</th><th>Dampak (bobot)</th><th>Skor</th><th>Kategori</th></tr>${ft}</table></div></div>`}
function trendBox(){
 const ns=db.notes.filter(n=>/^\d{4}-\d{2}/.test(n.tgl)&&(!tj||n.jenis==tj));
 const head=`<div class="box"><h2>Tren catatan lapangan per bulan</h2><div class="row"><select onchange="tj=this.value;render()" style="max-width:220px"><option value="">Semua jenis</option>${FJ.map(x=>`<option ${x==tj?"selected":""}>${x}</option>`).join("")}</select></div>`;
 if(!ns.length)return head+'<p class="empty">Belum ada catatan lapangan untuk pilihan ini.</p></div>';
 const mm=ns.map(n=>n.tgl.slice(0,7)).sort(),ls=[];
 let [yy,mo]=mm[0].split("-").map(Number);const [y2,m2]=mm[mm.length-1].split("-").map(Number);
 while((yy<y2||(yy==y2&&mo<=m2))&&ls.length<120){ls.push(yy+"-"+String(mo).padStart(2,"0"));mo++;if(mo>12){mo=1;yy++}}
 const bl=ls.slice(-24);
 const cnt=bl.map(k=>{const o={Tinggi:0,Sedang:0,Rendah:0};ns.filter(n=>n.tgl.slice(0,7)==k).forEach(n=>o[kat(skor(n))]++);return o});
 const tot=o=>o.Tinggi+o.Sedang+o.Rendah,mx=Math.max(1,...cnt.map(tot));
 const W=760,H=250,ml=34,bm=44,tp=12,bw=(W-ml-10)/bl.length,ph=H-bm-tp,st=Math.ceil(mx/5);
 let g="";
 for(let t=0;t<=mx;t+=st){const gy=tp+ph-t/mx*ph;g+=`<line x1="${ml}" y1="${gy}" x2="${W-10}" y2="${gy}" style="stroke:var(--ln)"/>`+tx(ml-6,gy+4,String(t),"end")}
 bl.forEach((k,i)=>{let yb=tp+ph;const o=cnt[i],x=ml+i*bw+bw*.15;
  ["Rendah","Sedang","Tinggi"].forEach(c=>{const hh=o[c]/mx*ph;if(hh>0){yb-=hh;g+=`<rect x="${x}" y="${yb}" width="${bw*.7}" height="${hh}" style="fill:${CL[c]}"><title>${k}: ${o[c]} catatan risiko ${c.toLowerCase()}</title></rect>`}});
  if(bl.length<=14||i%2==0)g+=tx(x+bw*.35,H-bm+14,k.slice(5)+"/"+k.slice(2,4),"middle")});
 g+=["Rendah","Sedang","Tinggi"].map((c,i)=>`<rect x="${ml+i*110}" y="${H-16}" width="10" height="10" style="fill:${CL[c]}"/>`+tx(ml+i*110+14,H-7,"Risiko "+c.toLowerCase())).join("");
 const best=cnt.reduce((b,o,i)=>tot(o)>b[1]?[bl[i],tot(o)]:b,["",0]);
 return head+sv(W,H,g)+`<p class="note">Bulan dengan catatan terbanyak: ${best[0]} (${best[1]} catatan). Warna menurut skor risiko tiap catatan. Data awal hanya 5 catatan yang bersumber berita, jadi tren ini belum mewakili frekuensi kejadian sebenarnya.</p></div>`}
function search(){const s=q;render();const i=document.querySelector(".bar input");i.focus();i.setSelectionRange(s.length,s.length)}
function submitF(e,k){
 e.preventDefault();if(!can("add"))return;const d=Object.fromEntries(new FormData(e.target));
 CFG[k].f.forEach(f=>{if(f.n)d[f.k]=Number(d[f.k]);if(f.t=="number")d[f.k]=d[f.k]===""?null:Number(d[f.k])});
 if(editing)Object.assign(db[k].find(x=>x.id==editing),d);else{d.id=Date.now();db[k].push(d)}
 logA(editing?"Ubah":"Tambah",CFG[k].title+": "+(d.nama||d.deskripsi||d.jenis||""));save();editing=null;render()}
function edit(id){editing=id;render();scrollTo(0,0)}
function del(k,id){
 if(!can("del")||!confirm("Hapus data ini?"))return;
 {const o=db[k].find(x=>x.id==id)||{};logA("Hapus",CFG[k].title+": "+(o.nama||o.deskripsi||o.jenis||id))}
 db[k]=db[k].filter(x=>x.id!=id);
 if(k=="rooms"){db.items=db.items.filter(i=>i.room!=id);db.factors=db.factors.filter(f=>f.room!=id);db.marks.forEach(m=>{if(m.room==id)m.room=0})}
 db.plans=db.plans.filter(p=>db.factors.some(f=>f.id==p.factor));
 save();render()}
function reset(){if(confirm("Kembalikan ke data awal? Semua perubahan akan hilang.")){if(!can("reset"))return;db=JSON.parse(JSON.stringify(seed));logA("Reset","Data dikembalikan ke data awal");go("dash")}}

function loginView(){return `<div class="box" style="max-width:420px;margin:30px auto"><h2>Masuk ke sistem</h2><form onsubmit="doLogin(event)" style="grid-template-columns:1fr"><label>Nama pengguna<input name="u" required autocomplete="off"></label><label>Kata sandi<input name="p" type="password" required></label><div><button class="btn" type="submit">Masuk</button></div></form><p class="note">Akun demo (simulasi sisi-browser, bukan keamanan nyata): admin / admin123, petugas / petugas123, pimpinan / pimpinan123.</p><div id="lerr" class="note" style="color:var(--er)"></div></div>`}
function doLogin(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const a=USERS[d.u];if(!a||a.p!==d.p){document.getElementById("lerr").textContent="Nama pengguna atau kata sandi salah.";return}user={name:d.u,role:a.role};try{sessionStorage.setItem("sim_user",JSON.stringify(user))}catch(x){}logA("Masuk","Login sebagai "+a.role);tab="dash";render()}
function logout(){logA("Keluar","Logout");user=null;try{sessionStorage.removeItem("sim_user")}catch(x){}render()}
function logView(){const r=db.log.map(l=>`<tr><td>${E(l.t)}</td><td>${E(l.u)}</td><td>${E(l.a)}</td><td>${E(l.d)}</td></tr>`).join("");return `<div class="box"><h2>Log aktivitas (${db.log.length})</h2><div class="tw"><table><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Rincian</th></tr>${r}</table>${r?"":'<p class="empty">Belum ada aktivitas.</p>'}</div><p class="note">Menyimpan 200 aktivitas terakhir.</p></div>`}
function render(){
 applyCfg();fillIdent();
 if(map&&!user){map.remove();map=null}
 document.getElementById("who").innerHTML=user?`Masuk sebagai <b>${E(user.name)}</b> (${user.role}) <button class="btn sec sm" onclick="logout()">Keluar</button>`:"";
 if(!user){nav();document.getElementById("app").innerHTML=loginView();return}
 nav();
 if(map&&tab!="map"){map.remove();map=null}
 document.getElementById("app").innerHTML=(tab=="dash"?dash():tab=="map"?mapView():tab=="log"?logView():tab=="rep"?reportView():tab=="doc"?docView():tab=="plan"?planView():tab=="cfg"?cfgView():crud(tab))+(can("reset")?'<p><button class="btn sec sm" onclick="reset()">Reset ke data awal</button></p>':"");
 if(tab=="map")initMap()}
render();
</script>
</body>
